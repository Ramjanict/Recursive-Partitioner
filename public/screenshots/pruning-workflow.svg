<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="prune-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="100%" stop-color="#1c2541"/>
    </linearGradient>
    <filter id="prune-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#prune-bg)"/>

  <!-- Title -->
  <text x="600" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#f8fafc" text-anchor="middle">Smart Tree Pruning &amp; Child Hoisting</text>
  <text x="600" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">Removing a partition automatically re-flows sibling space and eliminates orphaned container nodes</text>

  <!-- Left Card: Before Deletion -->
  <g transform="translate(80, 130)">
    <rect width="460" height="470" rx="14" fill="#111827" stroke="#374151" stroke-width="2" filter="url(#prune-shadow)"/>
    <text x="230" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="600" fill="#f87171" text-anchor="middle">Before Deletion: Target Panel B [-]</text>

    <!-- Simulated Layout -->
    <g transform="translate(30, 65)">
      <!-- Left: Panel A -->
      <rect x="0" y="0" width="190" height="340" rx="8" fill="#3b82f6"/>
      <text x="95" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Panel A</text>

      <!-- Vertical Divider -->
      <line x1="195" y1="0" x2="195" y2="340" stroke="#000000" stroke-width="6"/>

      <!-- Right: Subdivided into B & C -->
      <g transform="translate(200, 0)">
        <!-- Top: Panel B (marked for deletion) -->
        <rect x="0" y="0" width="190" height="165" rx="8" fill="#ef4444" stroke="#fca5a5" stroke-width="2" stroke-dasharray="6,4"/>
        <text x="95" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Panel B</text>
        <rect x="55" y="95" width="80" height="28" rx="6" fill="#991b1b"/>
        <text x="95" y="114" font-family="monospace" font-size="13" font-weight="bold" fill="#fecaca" text-anchor="middle">Click [-]</text>

        <!-- Horizontal Divider -->
        <line x1="0" y1="170" x2="190" y2="170" stroke="#000000" stroke-width="5"/>

        <!-- Bottom: Panel C -->
        <rect x="0" y="175" width="190" height="165" rx="8" fill="#10b981"/>
        <text x="95" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Panel C</text>
      </g>
    </g>

    <text x="230" y="440" font-family="monospace" font-size="13" fill="#94a3b8" text-anchor="middle">Parent node holds [Panel B, Panel C]</text>
  </g>

  <!-- Central Transition Arrow -->
  <g transform="translate(565, 335)">
    <circle cx="35" cy="15" r="28" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <path d="M 23 15 L 45 15 M 37 7 L 47 15 L 37 23" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="35" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#38bdf8" text-anchor="middle">Auto-Hoist</text>
  </g>

  <!-- Right Card: After Deletion -->
  <g transform="translate(660, 130)">
    <rect width="460" height="470" rx="14" fill="#111827" stroke="#374151" stroke-width="2" filter="url(#prune-shadow)"/>
    <text x="230" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="600" fill="#4ade80" text-anchor="middle">After Deletion: Seamless Rebalance</text>

    <!-- Simulated Layout -->
    <g transform="translate(30, 65)">
      <!-- Left: Panel A -->
      <rect x="0" y="0" width="190" height="340" rx="8" fill="#3b82f6"/>
      <text x="95" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Panel A</text>

      <!-- Vertical Divider -->
      <line x1="195" y1="0" x2="195" y2="340" stroke="#000000" stroke-width="6"/>

      <!-- Right: Panel C hoisted to occupy entire vertical half -->
      <rect x="200" y="0" width="200" height="340" rx="8" fill="#10b981" stroke="#86efac" stroke-width="2"/>
      <text x="300" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Panel C (Hoisted)</text>
      <text x="300" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#dcfce7" text-anchor="middle">Expanded to full parent space</text>
    </g>

    <text x="230" y="440" font-family="monospace" font-size="13" fill="#86efac" text-anchor="middle">Single child hoisted: parent unwrapped cleanly</text>
  </g>
</svg>
