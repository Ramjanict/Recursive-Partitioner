<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg-grad)"/>

  <!-- Header -->
  <text x="600" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#f8fafc" text-anchor="middle">Recursive Partitioning Workflow</text>
  <text x="600" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">Subdivide panels infinitely across horizontal and vertical axes with color persistence</text>

  <!-- Step 1: Initial State -->
  <g transform="translate(60, 130)">
    <rect width="320" height="460" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
    <text x="160" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#38bdf8" text-anchor="middle">1. Initial Root Panel</text>
    
    <!-- Panel Box -->
    <rect x="25" y="65" width="270" height="340" rx="8" fill="#3b82f6"/>
    <!-- Controls Pill -->
    <rect x="95" y="215" width="130" height="40" rx="6" fill="#ffffff" filter="url(#shadow)"/>
    <text x="122" y="240" font-family="monospace" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">v</text>
    <text x="160" y="240" font-family="monospace" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">h</text>
    <text x="198" y="240" font-family="monospace" font-size="18" font-weight="bold" fill="#0f172a" text-anchor="middle">-</text>

    <text x="160" y="435" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">Random base color generated</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 405 360 L 435 360" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <polygon points="433,353 447,360 433,367" fill="#38bdf8"/>

  <!-- Step 2: Vertical Split -->
  <g transform="translate(460, 130)">
    <rect width="320" height="460" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
    <text x="160" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#38bdf8" text-anchor="middle">2. Vertical Split ([v])</text>
    
    <!-- Left Child (Preserved) -->
    <rect x="25" y="65" width="132" height="340" rx="8" fill="#3b82f6"/>
    <rect x="56" y="220" width="70" height="30" rx="5" fill="#ffffff"/>
    <text x="71" y="240" font-family="monospace" font-size="13" font-weight="bold" fill="#0f172a">v</text>
    <text x="91" y="240" font-family="monospace" font-size="13" font-weight="bold" fill="#0f172a">h</text>
    <text x="111" y="240" font-family="monospace" font-size="13" font-weight="bold" fill="#0f172a">-</text>

    <!-- Divider -->
    <line x1="160" y1="65" x2="160" y2="405" stroke="#0f172a" stroke-width="6"/>

    <!-- Right Child (New Color) -->
    <rect x="163" y="65" width="132" height="340" rx="8" fill="#ec4899"/>
    <rect x="194" y="220" width="70" height="30" rx="5" fill="#ffffff"/>
    <text x="209" y="240" font-family="monospace" font-size="13" font-weight="bold" fill="#0f172a">v</text>
    <text x="229" y="240" font-family="monospace" font-size="13" font-weight="bold" fill="#0f172a">h</text>
    <text x="249" y="240" font-family="monospace" font-size="13" font-weight="bold" fill="#0f172a">-</text>

    <text x="160" y="435" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">Retains left color + fresh right hue</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 805 360 L 835 360" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <polygon points="833,353 847,360 833,367" fill="#38bdf8"/>

  <!-- Step 3: Horizontal Split (Nested) -->
  <g transform="translate(860, 130)">
    <rect width="320" height="460" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
    <text x="160" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#38bdf8" text-anchor="middle">3. Horizontal Split ([h])</text>
    
    <!-- Left Child -->
    <rect x="25" y="65" width="132" height="340" rx="8" fill="#3b82f6"/>
    <rect x="56" y="220" width="70" height="30" rx="5" fill="#ffffff"/>
    <text x="71" y="240" font-family="monospace" font-size="13" font-weight="bold" fill="#0f172a">v</text>
    <text x="91" y="240" font-family="monospace" font-size="13" font-weight="bold" fill="#0f172a">h</text>
    <text x="111" y="240" font-family="monospace" font-size="13" font-weight="bold" fill="#0f172a">-</text>

    <!-- Vertical Divider -->
    <line x1="160" y1="65" x2="160" y2="405" stroke="#0f172a" stroke-width="6"/>

    <!-- Right Top Child -->
    <rect x="163" y="65" width="132" height="166" rx="8" fill="#ec4899"/>
    <rect x="194" y="135" width="70" height="26" rx="5" fill="#ffffff"/>
    <text x="209" y="152" font-family="monospace" font-size="12" font-weight="bold" fill="#0f172a">v</text>
    <text x="229" y="152" font-family="monospace" font-size="12" font-weight="bold" fill="#0f172a">h</text>
    <text x="249" y="152" font-family="monospace" font-size="12" font-weight="bold" fill="#0f172a">-</text>

    <!-- Horizontal Divider -->
    <line x1="163" y1="234" x2="295" y2="234" stroke="#0f172a" stroke-width="6"/>

    <!-- Right Bottom Child -->
    <rect x="163" y="238" width="132" height="167" rx="8" fill="#10b981"/>
    <rect x="194" y="308" width="70" height="26" rx="5" fill="#ffffff"/>
    <text x="209" y="325" font-family="monospace" font-size="12" font-weight="bold" fill="#0f172a">v</text>
    <text x="229" y="325" font-family="monospace" font-size="12" font-weight="bold" fill="#0f172a">h</text>
    <text x="249" y="325" font-family="monospace" font-size="12" font-weight="bold" fill="#0f172a">-</text>

    <text x="160" y="435" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">Arbitrarily deep recursive nesting</text>
  </g>
</svg>
